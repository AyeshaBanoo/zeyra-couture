{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}
<h1>Edit Profile</h1>

<form class="auth-form" action="/edit_profile" method="POST">

<input
type="text"
name="name"
value="{{ user.name }}"
required>

<br><br>

<input
type="text"
name="phone"
value="{{ user.phone }}"
required>
<br><br>
<textarea
name="address"
required>{{ user.address }}</textarea>
<br><br>
<input
type="text"
name="pincode"
value="{{ user.pincode }}"
required>
<br><br>
<button type="submit">

Save Changes
</button>
</form>
{% endblock %}
