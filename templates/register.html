{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}


    <h1>Register</h1>

    <form class="auth-form" action="/register" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            name="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <input
            type="text"
            name="address"
            placeholder="Address"
            required
        >

        <input
            type="text"
            name="pincode"
            placeholder="Pincode"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>



{% endblock %}
